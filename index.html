<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Grupo VIP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
        }

        p {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn-whatsapp {
            display: inline-block;
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-whatsapp:hover {
            background-color: #20bd5a;
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
        }

        .footer-text {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ícone do WhatsApp -->
        <div class="icon">
            <svg viewBox="0 0 32 32">
                <path d="M16 2a13.94 13.94 0 0 0-12 21.1L2 30l7.1-1.9A13.94 13.94 0 1 0 16 2zm0 25.5a11.5 11.5 0 0 1-5.9-1.6l-.4-.2-4.4 1.2 1.2-4.3-.3-.4A11.5 11.5 0 1 1 16 27.5zm6.3-8.6c-.3-.2-2-.9-2.3-1s-.6-.2-.8.2-.9 1.1-1.1 1.3-.4.2-.7 0a9.2 9.2 0 0 1-2.7-1.7 10.1 10.1 0 0 1-1.9-2.3c-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.4.3-.6a.6.6 0 0 0 0-.6c0-.2-.8-2-.1.1-2.7s-.6-.6-.8-.6h-.7a1.4 1.4 0 0 0-1 .5 4.3 4.3 0 0 0-1.3 3.2 7.5 7.5 0 0 0 1.6 4 17.2 17.2 0 0 0 6.6 5.8c.9.4 1.7.6 2.3.8a5.5 5.5 0 0 0 2.5.2 4.1 4.1 0 0 0 2.7-1.9 3.3 3.3 0 0 0 .2-1.9c-.2-.2-.5-.3-.8-.5z"/>
            </svg>
        </div>

        <h1>Grupo Exclusivo no WhatsApp</h1>
        <p>Clique no botão abaixo para acessar o nosso grupo oficial e ter acesso a todo o conteúdo.</p>

        <!-- Substitua o '#' pelo link oficial do seu grupo de WhatsApp -->
        <a href="SEU_LINK_DO_WHATSAPP_AQUI" class="btn-whatsapp">ENTRAR NO GRUPO AGORA</a>

        <p class="footer-text">Ambiente seguro. Você será redirecionado para o app do WhatsApp.</p>
    </div>

</body>
</html>
